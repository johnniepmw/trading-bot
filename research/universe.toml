# The strategy's universe and benchmark, with data-source symbols (docs/strategies/trend-long-or-cash.md).
# Read by scripts/export_history.py. Market data only; no account data. A high-risk path:
# it defines what can be traded and where the hold-out starts.
#
# Symbols are UNVERIFIED until the owner's `--list` run and Phase 0 API check: Yahoo uses
# ".L" for the London Stock Exchange, EODHD ".LSE" (funds' own series only: it is the
# cross-check over its free year, and proxies' spliced years are older than that). `distributing` says whether the series
# pays dividends out (its adjusted close then rises faster than its close); it is checked
# against the data. `proxies` are older funds on the same index, spliced under the fund's own
# history (oldest first), chosen from `--list` output before any price data is examined.

hold_out_start = "2023-01-01"

[[fund]]
ticker = "VWRP"   # global equity, FTSE All-World
role = "trade"
yahoo = "VWRP.L"
eodhd = "VWRP.LSE"
distributing = false
proxies = [{ yahoo = "VWRL.L", distributing = true }]   # same index, since 2012

[[fund]]
ticker = "VUKE"   # UK equity, FTSE 100
role = "trade"
yahoo = "VUKE.L"
eodhd = "VUKE.LSE"
distributing = true
proxies = []

