# The strategy's universe and benchmark, with data-source symbols (docs/strategies/trend-long-or-cash.md).
# Read by scripts/export_history.py. Market data only; no account data. A high-risk path:
# it defines what can be traded and where the hold-out starts.
#
# Symbols are UNVERIFIED until the owner's `--list` run and Phase 0 API check: Yahoo uses
# ".L" for the London Stock Exchange, EODHD ".LSE". A series with an EODHD symbol takes its
# prices from EODHD (the paid plan's full history), checked against Yahoo's; one without
# (the Vanguard fund under VAGP, which EODHD doesn't list on the LSE) is Yahoo's alone. `distributing` says whether the series
# pays dividends out (its adjusted close then rises faster than its close); it is checked
# against the data. `proxies` are older funds on the same index, spliced under the fund's own
# history (oldest first), chosen from `--list` output before any price data is examined.

hold_out_start = "2023-01-01"

[[fund]]
ticker = "VWRP"   # global equity, FTSE All-World
role = "trade"
yahoo = "VWRP.L"
eodhd = "VWRP.LSE"
distributing = false
proxies = [{ yahoo = "VWRL.L", eodhd = "VWRL.LSE", distributing = true }]   # same index, since 2012

[[fund]]
ticker = "VUKE"   # UK equity, FTSE 100
role = "trade"
yahoo = "VUKE.L"
eodhd = "VUKE.LSE"
distributing = true
proxies = []

[[fund]]
ticker = "EMIM"   # emerging markets, MSCI EM IMI
role = "trade"
yahoo = "EMIM.L"
eodhd = "EMIM.LSE"
distributing = false
proxies = []

[[fund]]
ticker = "IGLT"   # UK gilts
role = "trade"
yahoo = "IGLT.L"
eodhd = "IGLT.LSE"
distributing = true
proxies = []

[[fund]]
ticker = "VAGP"   # global aggregate bonds, GBP hedged, Distributing (monthly); Vanguard factsheet 31 Oct 2026: inception 2019-06-18
role = "trade"
yahoo = "VAGP.L"
eodhd = "VAGP.LSE"
distributing = true
# Vanguard Global Bond Index Fund GBP Hedged Acc (an OEIC, daily price): the same index,
# from 2014-01-02 on Yahoo; chosen by the owner from first dates only, 2026-11-25
proxies = [{ yahoo = "0P0000KM24.L", distributing = false }]

[[fund]]
ticker = "INXG"   # UK index-linked gilts
role = "trade"
yahoo = "INXG.L"
eodhd = "INXG.LSE"
distributing = true
proxies = []

[[fund]]
ticker = "SGLN"   # physical gold
role = "trade"
yahoo = "SGLN.L"
eodhd = "SGLN.LSE"
distributing = false
proxies = []

[[fund]]
ticker = "SSAC"   # MSCI ACWI: the owner's benchmark, never traded (monitoring spec)
role = "benchmark"
yahoo = "SSAC.L"
eodhd = "SSAC.LSE"
distributing = false
proxies = []
