name: deploy

# Every push to main: build once → the staging job (image only, then a `smoke` execution,
# rolled back on failure) → the prod job, only once the owner sets DEPLOY_PROD=true (after
# Phase 2 steps 3-4): deploy window, image only, a `run --dry-run` execution against prod,
# rolled back on failure (ADR-0019). Reads execution status only, never logs (ADR-0014).
# Runs no repository test code while deployer credentials are present. Inactive until
# `make gh-vars` has set the cloud variables.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "infra/**"
  workflow_dispatch:
    inputs:
      drill:
        description: "Broken-deploy drill: after the normal staging deploy, deploy a broken copy to staging and check it is rolled back (no prod)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  build:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build once and push
        id: push
        env:
          AR_REPO: ${{ vars.AR_REPO }}
        run: |
          version="${GITHUB_SHA::12}"
          ref="${AR_REPO}/${APP_NAME}:${version}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker buildx build --build-arg GIT_SHA="$version" -t "$ref" --push --metadata-file /tmp/meta.json .
          digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
          echo "image=${AR_REPO}/${APP_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy to the staging job (smoke execution, rollback on failure)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: bash scripts/cloudrun-job-deploy.sh staging "$IMAGE"

  # AC13 drill (ADR-0019): a deploy whose check fails must leave staging on the good image.
  drill:
    needs: [build, staging]
    if: inputs.drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy a broken copy to staging and expect the rollback
        env:
          GOOD: ${{ needs.build.outputs.image }}
          AR_REPO: ${{ vars.AR_REPO }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          mkdir -p /tmp/drill
          printf 'FROM %s\nENTRYPOINT ["false"]\n' "$GOOD" > /tmp/drill/Dockerfile
          docker buildx build -t "${AR_REPO}/${APP_NAME}:drill-broken" --push --metadata-file /tmp/drill/meta.json /tmp/drill
          broken="${AR_REPO}/${APP_NAME}@$(jq -r '."containerimage.digest"' /tmp/drill/meta.json)"
          if bash scripts/cloudrun-job-deploy.sh staging "$broken"; then
            echo "drill FAILED: the broken image was accepted" >&2; exit 1
          fi
          now="$(gcloud run jobs describe "${APP_NAME}-staging" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          [ "$now" = "$GOOD" ] || { echo "drill FAILED: staging is on ${now##*@}, not ${GOOD##*@}" >&2; exit 1; }
          echo "drill passed: the broken deploy failed its check and staging is back on ${GOOD##*@}"

  production:
    needs: [build, staging]
    if: vars.DEPLOY_PROD == 'true' && !inputs.drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy to the prod job (window, dry-run execution, rollback on failure)
        id: deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set +e
          bash scripts/cloudrun-job-deploy.sh prod "$IMAGE"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 75 ]; then
            echo "::warning::Prod deploy refused by the window (a run is due soon or running); nothing changed. Re-run this job later."
          fi
          exit "$code"
      - name: Open an incident issue on failure
        # a window refusal (75) changed nothing: not an incident
        if: failure() && steps.deploy.outputs.code != '75'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --label incident \
            --title "Production deploy of ${GITHUB_SHA::7} failed" \
            --body "The prod deploy failed for ${GITHUB_SHA}: its dry-run execution failed (a fault in the image, not a business stop) and the job went back to its previous image. Run: ${RUN_URL}. Execution logs are in Cloud Logging only (ADR-0014). Next step: the incident skill."
