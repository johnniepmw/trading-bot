name: deploy

# Every push to main: build once → staging (smoke + e2e) → production candidate (smoke)
# → 100% traffic → watch → automatic rollback on failure. Inactive until `make gh-vars`
# has set the cloud variables.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  build:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build once and push
        id: push
        env:
          AR_REPO: ${{ vars.AR_REPO }}
        run: |
          version="${GITHUB_SHA::12}"
          ref="${AR_REPO}/${APP_NAME}:${version}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker buildx build --build-arg GIT_SHA="$version" -t "$ref" --push --metadata-file /tmp/meta.json .
          digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
          echo "image=${AR_REPO}/${APP_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy to staging
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/cloudrun-deploy.sh staging "$IMAGE" "$VERSION"
      - name: End-to-end tests against staging
        run: |
          url="$(gcloud run services describe "${APP_NAME}-staging" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')"
          make setup && make e2e-setup
          E2E_BASE_URL="$url" make e2e

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy to production (candidate, smoke, switch, watch, auto-rollback)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/cloudrun-deploy.sh prod "$IMAGE" "$VERSION"
      - name: Open an incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --label incident \
            --title "Production deploy of ${GITHUB_SHA::7} failed" \
            --body "The deploy pipeline failed for ${GITHUB_SHA}. If traffic had already switched, it was rolled back automatically. Run: ${RUN_URL}. Next step: the incident skill (diagnose, fix forward with a regression test, postmortem)."
