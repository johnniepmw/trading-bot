name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Scan the PR's commits (or the pushed range) for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            export GITLEAKS_LOG_OPTS="${BASE_SHA}..HEAD"
          fi
          make secrets-scan

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make setup
      - run: make check

  e2e:
    name: e2e-local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make setup
      - run: make e2e-setup
      - run: make e2e
      - name: Keep the e2e report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-local
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build and scan the container image
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet; skipping."; exit 0; fi
          docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" -t app:ci .
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress app:ci

  preview:
    name: preview-e2e
    if: github.event_name == 'pull_request' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.APP_NAME }}-staging
      TAG: pr-${{ github.event.pull_request.number }}
      IMAGE: ${{ vars.AR_REPO }}/${{ vars.APP_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_PREVIEW }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push the preview image
        id: build
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet; skipping preview."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy a no-traffic revision tagged for this PR
        id: deploy
        if: steps.build.outputs.skip != '1'
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --no-traffic --tag "$TAG" \
            --update-env-vars "APP_VERSION=${GITHUB_SHA::12},APP_ENV=preview" --quiet
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json \
            | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the preview
        if: steps.build.outputs.skip != '1'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke.sh "$URL" "${GITHUB_SHA::12}"
      - name: End-to-end tests against the preview
        if: steps.build.outputs.skip != '1'
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: make setup && make e2e-setup && make e2e
      - name: Comment the preview URL
        if: always() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf 'Preview for %s: %s\n' "${GITHUB_SHA::7}" "$URL" > /tmp/preview.md
          bash scripts/pr-comment.sh "$PR" preview-url /tmp/preview.md
      - name: Keep the e2e report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-preview
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: ci-required
    if: always()
    needs: [secrets, check, e2e, image, preview]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')"
          [ "$bad" -eq 0 ]
