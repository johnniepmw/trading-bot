name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan needs the PR's base and head commits
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: make setup
      - name: make check
        env:
          # Pull requests: scan only the PR's own commits. Pushes to main: main's history
          # (the script's default, HEAD). A range that doesn't resolve fails the job.
          SECRETS_SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
        run: make check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: make setup
      - run: make e2e-setup
      - run: make e2e
      - name: Keep the e2e report when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Build and scan the container image
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet; skipping."; exit 0; fi
          docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" -t app:ci .
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress app:ci

  required:
    name: ci-required
    if: always()
    needs: [check, e2e, image]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')"
          [ "$bad" -eq 0 ]
