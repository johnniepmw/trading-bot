name: risk-gate

# Sets the required `risk-gate` status. Standard-risk PRs pass immediately. High-risk PRs
# (paths in .github/risk-paths.txt) stay pending until the owner comments
# `/approve-risk <head sha>`. Runs code from the default branch only and never checks out
# PR code, so a PR cannot change the rules that judge it.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: risk-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: risk-gate-evaluate  # the required status is "risk-gate", set by the script
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve-risk'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # commenting on a PR needs it (issues: write alone was refused)
      issues: write
      statuses: write
    steps:
      - name: Check out the default branch (trusted code only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          APPROVER: ${{ vars.RISK_APPROVER || github.repository_owner }}
        run: python3 scripts/risk_gate.py
