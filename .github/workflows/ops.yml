name: ops

# Manual operations without a deploy. Runnable from the GitHub mobile app.
#   rollback  put the job back on the image it ran before the last deploy (or a named digest)
#   pause     pause the job's schedule (stops new runs; only the owner resumes it)
#   kill      turn a feature flag off via the remote override
#   set       force a flag on/off (owner)      restore   remove the override (owner)
# Agents may run rollback and kill (any env) and anything in staging; the kit's guard hook
# enforces that, and the deployer identity only works from main.

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [rollback, pause, kill, set, restore]
        required: true
      env:
        type: choice
        options: [staging, prod]
        required: true
      flag:
        description: Flag name from flags.json (kill/set/restore)
        type: string
        required: false
      value:
        description: For set only
        type: choice
        options: ["false", "true"]
        default: "false"
        required: false
      image:
        description: For rollback only (optional image@sha256:...; default = the image before the last deploy)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ops-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      APP_NAME: ${{ vars.APP_NAME }}
      ACTION: ${{ inputs.action }}
      TARGET_ENV: ${{ inputs.env }}
      FLAG: ${{ inputs.flag }}
      VALUE: ${{ inputs.value }}
      IMAGE: ${{ inputs.image }}
      AR_REPO: ${{ vars.AR_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Run
        run: |
          echo "ops: ${ACTION} on ${TARGET_ENV} by ${GITHUB_ACTOR}"
          case "$ACTION" in
            rollback) bash scripts/cloudrun-job-rollback.sh "$TARGET_ENV" "$IMAGE" ;;
            pause) gcloud scheduler jobs pause "${APP_NAME}-${TARGET_ENV}-daily" --location "$GCP_REGION" --project "$GCP_PROJECT" --quiet ;;
            kill|restore) bash scripts/flag-override.sh "$TARGET_ENV" "$ACTION" "$FLAG" ;;
            set) bash scripts/flag-override.sh "$TARGET_ENV" set "$FLAG" "$VALUE" ;;
          esac
      - name: Record production operations as an issue
        if: always() && inputs.env == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue create --label incident \
            --title "ops: ${ACTION} on prod (${FLAG:-${IMAGE:-previous image}}) — ${OUTCOME}" \
            --body "Triggered by ${GITHUB_ACTOR}. Run: ${RUN_URL}. Follow up with a fix-forward PR and close this issue when resolved."
