name: nightly

# Slower checks that don't belong on every PR: full e2e against staging, mutation
# tests, dependency and image vulnerability audit. Failures open (or update) an issue
# that the garden skill picks up.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-staging:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_INFRA_PLAN }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: |
          url="$(gcloud run services describe "${{ vars.APP_NAME }}-staging" --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          make setup && make e2e-setup
          E2E_BASE_URL="$url" E2E_INCLUDE_QUARANTINED=1 make e2e

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: make setup && make mutation

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Dependency vulnerabilities (lockfiles)
        run: trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress .
      - name: Image vulnerabilities
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile"; exit 0; fi
          docker build -t app:nightly .
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress app:nightly

  report:
    if: failure()
    needs: [e2e-staging, mutation, audit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly checks failing"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly-failure --title "$title" --body "Failed run: ${RUN_URL}"
          fi
