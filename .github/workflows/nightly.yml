name: nightly

# Slower checks that don't belong on every PR: mutation tests, dependency and image
# vulnerability audit (staging is checked by every deploy's smoke execution). Failures
# open (or update) an issue that the garden skill picks up.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: make setup && make mutation

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Dependency vulnerabilities (lockfiles)
        run: trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress .
      - name: Image vulnerabilities
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile"; exit 0; fi
          docker build -t app:nightly .
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress app:nightly

  report:
    if: failure()
    needs: [mutation, audit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly checks failing"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly-failure --title "$title" --body "Failed run: ${RUN_URL}"
          fi
