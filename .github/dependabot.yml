version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # --- stack ecosystem (appended by scripts/init-stack.sh) ---

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
