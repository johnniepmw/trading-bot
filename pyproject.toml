[project]
name = "tradingbot"
version = "0.1.0"
description = "Risk-first automated trading bot: a long-or-cash trend system on UK-listed ETFs via the Trading 212 API"
requires-python = ">=3.13"
dependencies = []

# Dev tools are added at current versions by the stack's init (uv add --dev ...).

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".claude", "infra", "stacks"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, S bandit, N naming,
# SIM simplify, RUF ruff, BLE blind except, A builtins, PL pylint subset
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "BLE", "A", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603"]
"scripts/**" = ["S603", "S607", "PLR2004", "PLR0912", "PLR0915", "E501"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["tradingbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end tests (run with make e2e; target E2E_BASE_URL)",
  "integration: tests against real local dependencies",
  "flaky: quarantined; runs nightly only (docs/testing.md)",
]

[tool.importlinter]
root_package = "tradingbot"
include_external_packages = true

# The four contracts from the Phase 0 brief (ARCHITECTURE.md, "Boundaries").
[[tool.importlinter.contracts]]
name = "1. domain imports nothing else from the project"
type = "forbidden"
source_modules = ["tradingbot.domain"]
forbidden_modules = [
  "tradingbot.data", "tradingbot.strategy", "tradingbot.portfolio", "tradingbot.risk",
  "tradingbot.execution", "tradingbot.brokers", "tradingbot.ledger", "tradingbot.config",
  "tradingbot.app",
]

[[tool.importlinter.contracts]]
name = "2a. strategy, portfolio and risk import only domain and config (no brokers, data I/O, HTTP or environment)"
type = "forbidden"
source_modules = ["tradingbot.strategy", "tradingbot.portfolio", "tradingbot.risk"]
forbidden_modules = [
  "tradingbot.data", "tradingbot.execution", "tradingbot.brokers", "tradingbot.ledger",
  "tradingbot.app", "os", "urllib", "http", "httpx", "requests", "urllib3", "aiohttp", "socket",
]

[[tool.importlinter.contracts]]
name = "2b. strategy, portfolio and risk do not import each other"
type = "independence"
modules = ["tradingbot.strategy", "tradingbot.portfolio", "tradingbot.risk"]

[[tool.importlinter.contracts]]
name = "3a. only brokers (and app's GCP adapters) import HTTP libraries"
type = "forbidden"
source_modules = [
  "tradingbot.domain", "tradingbot.data", "tradingbot.strategy", "tradingbot.portfolio",
  "tradingbot.risk", "tradingbot.execution", "tradingbot.ledger", "tradingbot.config",
]
forbidden_modules = ["urllib", "http", "httpx", "requests", "urllib3", "aiohttp"]

[[tool.importlinter.contracts]]
name = "3b. only app wires in concrete brokers"
type = "forbidden"
source_modules = [
  "tradingbot.domain", "tradingbot.data", "tradingbot.strategy", "tradingbot.portfolio",
  "tradingbot.risk", "tradingbot.execution", "tradingbot.ledger", "tradingbot.config",
]
forbidden_modules = ["tradingbot.brokers.trading212", "tradingbot.brokers.fake"]

[[tool.importlinter.contracts]]
name = "4. research is never imported by src"
type = "forbidden"
source_modules = ["tradingbot"]
forbidden_modules = ["research"]

[tool.mutmut]
paths_to_mutate = ["src/tradingbot/domain/"]
tests_dir = ["tests/"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
